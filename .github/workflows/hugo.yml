name: Hugo Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_ENV: production
      HUGO_VERSION: 0.140.0
      
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Verify Hugo Installation
        run: hugo version

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node.js dependencies
        run: npm install

      # The Brevo API key is no longer part of this build. It lives as a
      # Cloudflare secret on the getbtcz-subscribe Worker, which the form posts
      # to, so it never reaches a visitor's browser. This step only guards
      # against a key being reintroduced into the published site by accident.
      # Brevo keys look like <64 hex>-<16 alnum>, optionally with an "xkeysib-"
      # prefix. Matching the body rather than the prefix catches both forms -
      # the key that used to be published here had no prefix at all.
      - name: Ensure no API key is published
        run: |
          if grep -rlE "[a-f0-9]{64}-[A-Za-z0-9]{16}" \
               static/ layouts/ content/ data/ assets/ 2>/dev/null; then
            echo "::error::A Brevo API key is present in files that get published. Aborting."
            exit 1
          fi
          echo "No API key found in publishable files."

      - name: List Project Structure
        run: |
          echo "Project structure:"
          ls -la
          echo "Theme directory:"
          ls -la themes/PaperMod
          echo "Layouts directory:"
          ls -la layouts/
          echo "Partials directory:"
          ls -la layouts/partials/

      - name: Build Hugo Site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENABLEGITINFO: true
        run: |
          hugo --logLevel debug --minify

      - name: Check Build Output
        if: always()
        run: |
          echo "Checking build output..."
          if [ -d "public" ]; then
            echo "Content of public directory:"
            ls -la public/
          else
            echo "public directory not found!"
            echo "Current directory contents:"
            ls -la
            echo "Hugo error log:"
            hugo --logLevel debug
          fi

      - name: Deploy
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: getbtcz.com
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: ${{ github.event.head_commit.message }}
