name = "getbtcz-subscribe"
main = "worker/subscribe.js"
compatibility_date = "2026-07-31"
account_id = "faf488ca3bb04d7dfb2f20648ffc01e0"
workers_dev = false

# Same-origin endpoint for the newsletter form, so the Brevo key never reaches
# the browser. Secrets are set with `wrangler secret put`:
#   BREVO_API_KEY     - Brevo v3 API key
#   TURNSTILE_SECRET  - Cloudflare Turnstile secret for the getbtcz.com widget
[[routes]]
pattern = "getbtcz.com/api/subscribe"
zone_name = "getbtcz.com"

[vars]
BREVO_LIST_ID = "3"

# Per-IP rate limit: 5 subscribe attempts per 60 seconds
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
